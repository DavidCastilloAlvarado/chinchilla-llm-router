name: release

# Manual release: run from the Actions tab (or `gh workflow run release
# -f version=vX.Y.Z`). The version input is validated against the required
# format, and the tag is created by the release step — you never push tags
# by hand. Before dispatching, prepare installer/package.json: set
# llmRouter.version to the binary version being released and bump version
# above the latest npm publish — the workflow validates both up front and
# fails fast if they don't match. CI never rewrites versions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version — must match v<major>.<minor>.<patch> (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write   # OIDC token for npm Trusted Publishing (no stored secret)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a valid release version — required format: v<major>.<minor>.<patch> (e.g. v0.1.0)"
            exit 1
          fi
          echo "version format OK: $VERSION"

      - uses: actions/checkout@v4

      # Fail fast if the installer package isn't prepared for this release:
      # llmRouter.version must equal the binary version being released, and
      # the package version must be newer than everything already on npm.
      # Versions are set by hand in installer/package.json before dispatch.
      - name: Validate installer/package.json for this release
        run: |
          BIN_VERSION="${VERSION#v}"
          PUBLISHED=$(npm view chinchilla-llm-router versions --json 2>/dev/null || echo '[]')
          BIN_VERSION="$BIN_VERSION" PUBLISHED="$PUBLISHED" node - <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('installer/package.json', 'utf8'));
          const bin = process.env.BIN_VERSION;
          const published = JSON.parse(process.env.PUBLISHED || '[]');
          const num = (v) => v.split('.').map(Number);
          const cmp = (a, b) => {
            a = num(a); b = num(b);
            for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) - (b[i] || 0);
            return 0;
          };
          const errors = [];
          if (p.llmRouter.version !== bin) {
            errors.push(`llmRouter.version is '${p.llmRouter.version}' but this release is v${bin} — set it to '${bin}'`);
          }
          if (published.includes(p.version)) {
            errors.push(`version '${p.version}' is already published on npm — bump the version field`);
          } else if (published.some((v) => cmp(p.version, v) < 0)) {
            errors.push(`version '${p.version}' is older than published versions (${published.sort((x, y) => cmp(x, y)).join(', ')}) — bump the version field`);
          }
          if (errors.length) {
            for (const e of errors) console.error(`::error::installer/package.json is not ready for release v${bin}: ${e}`);
            console.error('::error::Fix installer/package.json, commit, and re-dispatch the release.');
            process.exit(1);
          }
          console.log(`installer/package.json OK: version=${p.version}, llmRouter.version=${p.llmRouter.version} (npm published: ${published.length ? published.join(', ') : 'none'})`);
          EOF

      - name: Reject if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            echo "::error::Tag $VERSION already exists — delete the existing release first, or pick a new version"
            exit 1
          fi
          echo "tag $VERSION is free"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Unit tests
        run: make test

      - name: Cross-compile release binaries
        run: make release VERSION="${VERSION#v}"

      - name: Publish GitHub release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/llm-router_*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  # Publish the npm installer exactly as committed — the versions were
  # validated up front in build-and-release, so this job never rewrites
  # package.json. Auth is npm Trusted Publishing (OIDC): with `id-token:
  # write`, npm 11 (Node 24) fetches the GitHub OIDC token itself and
  # exchanges it for a short-lived registry token — no token/secret stored.
  # The publisher registered on npmjs.com is scoped to the `production`
  # environment, so this job runs in it (create it under repo Settings →
  # Environments if it doesn't exist yet).
  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, whose `publish` command automatically picks up
      # the runner's OIDC token (id-token: write) and exchanges it for a
      # short-lived npm registry token. npm 10 (Node 22) does not do this
      # and fails with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish npm installer
        working-directory: installer
        run: |
          # --loglevel verbose: if the automatic OIDC flow is ever skipped or
          # fails, the reason is printed here instead of a bare ENEEDAUTH.
          npm publish --access public --provenance --loglevel verbose
