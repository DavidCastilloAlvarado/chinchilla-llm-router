name: release

# Manual release: run from the Actions tab (or `gh workflow run release
# -f version=vX.Y.Z`). The version input is validated against the required
# format, and the tag is created by the release step — you never push tags
# by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version — must match v<major>.<minor>.<patch> (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write   # OIDC token for npm Trusted Publishing (no stored secret)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a valid release version — required format: v<major>.<minor>.<patch> (e.g. v0.1.0)"
            exit 1
          fi
          echo "version format OK: $VERSION"

      - uses: actions/checkout@v4

      - name: Reject if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            echo "::error::Tag $VERSION already exists — delete the existing release first, or pick a new version"
            exit 1
          fi
          echo "tag $VERSION is free"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Unit tests
        run: make test

      - name: Cross-compile release binaries
        run: make release VERSION="${VERSION#v}"

      - name: Publish GitHub release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/llm-router_*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  # Publish the npm installer so `npx chinchilla-llm-router` picks up the new
  # binary: repin llmRouter.version, bump the package version, publish, then
  # commit + push so the repo matches what's on the registry. Auth is via npm
  # Trusted Publishing (OIDC): register a publisher on npmjs.com for issuer
  # https://token.actions.githubusercontent.com, subject
  # repository:DavidCastilloAlvarado/chinchilla-llm-router:release, package
  # chinchilla-llm-router — no token/secret needed.
  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish npm installer (repoint binary pin)
        working-directory: installer
        run: |
          BIN_VERSION="${VERSION#v}"
          CURRENT_PIN=$(node -p "require('./package.json').llmRouter.version")
          if [ "$CURRENT_PIN" = "$BIN_VERSION" ]; then
            echo "installer already pins binary $BIN_VERSION — nothing to publish"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.llmRouter.version = '$BIN_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm version patch --no-git-tag-version
          npm publish --access public --provenance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: pin llm-router binary $BIN_VERSION"
          git push
